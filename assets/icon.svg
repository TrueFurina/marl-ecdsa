<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#101c36"/>
    </linearGradient>
    <linearGradient id="hex" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="0.55" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- 六边形链环（CW-PBFT 共识环） -->
  <g filter="url(#glow)" fill="none" stroke="url(#hex)" stroke-width="14" stroke-linejoin="round">
    <polygon points="256,84 400,166 400,346 256,428 112,346 112,166"/>
  </g>
  <!-- 共识节点（6 个顶点，含 1 个拜占庭隔离点示意） -->
  <g fill="#e2f0ff">
    <circle cx="256" cy="84"  r="20"/>
    <circle cx="400" cy="166" r="20"/>
    <circle cx="400" cy="346" r="20"/>
    <circle cx="256" cy="428" r="20"/>
    <circle cx="112" cy="346" r="20"/>
    <circle cx="112" cy="166" r="20"/>
  </g>
  <circle cx="256" cy="84" r="34" fill="none" stroke="#34d399" stroke-width="5" opacity="0.9"/>
  <!-- 中心：链块 -->
  <g transform="translate(256,256)">
    <rect x="-58" y="-44" width="116" height="88" rx="14" fill="#0d1a30" stroke="#38bdf8" stroke-width="5"/>
    <rect x="-58" y="-44" width="116" height="26" rx="13" fill="#16294a" stroke="none"/>
    <circle cx="-34" cy="-31" r="6" fill="#34d399"/>
    <circle cx="-14" cy="-31" r="6" fill="#fbbf24"/>
    <circle cx="6"  cy="-31" r="6" fill="#38bdf8"/>
    <text x="0" y="26" text-anchor="middle" font-family="Consolas,monospace" font-size="34" font-weight="700" fill="#7dd3fc">CW</text>
  </g>
</svg>
