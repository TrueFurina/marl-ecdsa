name: CI - Test Suite

# =============================================================================
# 为什么这个文件必须在**仓库根**的 .github/workflows/ 下
#
# GitHub Actions 只扫描仓库根目录的 .github/workflows/。此前本工作流写在
# marl-ecdsa-consensus-chain/.github/workflows/ci.yml —— 那个路径不会被注册成
# 工作流，因此**一次都没运行过**（/actions/workflows 里只有 build-binaries 与
# pages-build-deployment）。
#
# 代价是有实测记录的：2026-11-03 的 d9e701c（"sync: 源码对齐 V29 新基线"）
# 把 6 处安全/正确性修复连同另外 4 处一起覆盖回旧版，仓库里那 6 个回归锁文件
# 全红（19 failed + 1 collection error），而 main 上的审计简报仍写着"9 处缺陷
# 全部已修复"。没有 CI 就没有人被告知。
#
# 本文件是那次事故的结构性修复：把测试门搬到会被执行的位置，并把安全不变量
# 单独拆成一个 fail-fast 的 job —— 它跑得比全量套件快得多（只装 numpy +
# cryptography），一旦被回退就立刻红。
# =============================================================================

on:
  push:
    branches: [main]
    paths:
      - 'marl-ecdsa-consensus-chain/**'
      - '.github/workflows/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    # 入口脚本与 pyproject.toml 都在子目录里
    working-directory: marl-ecdsa-consensus-chain

jobs:
  # ---------------------------------------------------------------------------
  # 第一道：安全不变量（fail-fast，依赖极轻，几十秒内出结果）
  # ---------------------------------------------------------------------------
  security-invariants:
    name: 安全不变量（fail-fast）
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install minimal deps
        run: |
          python -m pip install --upgrade pip
          pip install cryptography numpy pytest pytest-asyncio pytest-timeout

      - name: Security / correctness invariants
        # 这些文件锁的是「可被静默回退的语义」，不是覆盖率：
        #   security_guard   —— k 重用检测 fail-closed + 淘汰归档 + 类型归一
        #   ecdsa_utils      —— 签名与载荷绑定（含 extra），裸字节包拒绝
        #   mappo / qmix     —— critic 目标形状、状态离散化确定性
        #   nash_verifier    —— 混合策略均衡 p_me 与 p_opp 同公式
        #   standard_pbft    —— 女巫门控 + 自报权重纠偏
        #   failover         —— 心跳缺省值不得伪造超时
        #   incentive        —— NaN 不得被钳成满分 / 污染账本
        run: |
          python -m pytest -q \
            tests/test_security_guard_type_confusion.py \
            tests/test_security_guard_kreuse_eviction.py \
            tests/test_signature_payload_binding.py \
            tests/test_verify_package_field_binding.py \
            tests/test_mappo_critic_targets.py \
            tests/test_qmix_state_index_determinism.py \
            tests/test_nash_verifier_canonical.py \
            tests/test_standard_pbft_sybil_gate.py \
            tests/test_failover_heartbeat_semantics.py \
            tests/test_incentive_nonfinite_guard.py

  # ---------------------------------------------------------------------------
  # 第二道：全量测试套件
  # ---------------------------------------------------------------------------
  test:
    name: pytest (${{ matrix.python-version }})
    needs: security-invariants
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('marl-ecdsa-consensus-chain/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-asyncio pytest-timeout

      - name: Run test suite
        run: |
          python -m pytest tests/ -v --tb=short

      - name: Verify dashboard imports (Flask route registration)
        run: |
          python -c "from visualization.dashboard import _create_app; app = _create_app(); assert app is not None; print('dashboard OK, routes:', len(app.url_map._rules))"

      - name: Verify consensus factory (all modes)
        run: |
          python -c "
          from blockchain.consensus.factory import create_consensus_engine
          for mode in ['cw_pbft', 'standard_pbft', 'fast']:
              eng = create_consensus_engine('node_0', ['node_0','node_1','node_2'], mode=mode)
              assert eng is not None
          print('consensus factory OK')
          "

      # ---- 裸命令冒烟（评委视角：无 PYTHONPATH）-----------------------------
      # 教训存档：conftest 把项目根注入 sys.path，导致 tests/ 全绿但按说明书裸跑
      # 入口脚本时 ModuleNotFoundError。
      - name: Bare-command smoke (no PYTHONPATH)
        run: |
          env -u PYTHONPATH python scripts/network_demo.py --help >/dev/null
          env -u PYTHONPATH python scripts/one-click/start_p2p_cluster.py --help >/dev/null
          env -u PYTHONPATH python scripts/one-click/run_full_experiment.py --help >/dev/null
          env -u PYTHONPATH python train.py --help >/dev/null
          env -u PYTHONPATH python main.py --help >/dev/null
          env -u PYTHONPATH python scripts/smoke_test_e2e.py
          echo "bare-command smoke OK"

      # ---- 口径门禁（rules 已分层入库，CI 无私有配置时规则依然生效）--------
      - name: Caliber gate — void tokens (fail-closed)
        run: |
          python scripts/scan_void_tokens.py \
            --root "$PWD" \
            --report "$RUNNER_TEMP/scan_void_tokens_report.json" \
            --overwrite

      - name: Pre-commit gates — repo-wide (fail-closed)
        run: |
          # 自证先行：先证明门禁不是空转，再拿它们判仓库。
          python scripts/pre-commit/secrets_scan.py --self-test
          python scripts/pre-commit/structure_guard.py --self-test
          python scripts/pre-commit/honesty_scan.py --self-test
          # secrets_scan 自己调 `git ls-files -z` 取清单：此前写的是
          #   secrets_scan.py $(git ls-files)
          # shell 按空格切词，文件名含空格就变成两个不存在的路径，两个都被静默跳过。
          # --strict 让「一个文件都没扫到」也失败 —— cwd 跑偏时正是这种假绿形态。
          python scripts/pre-commit/secrets_scan.py --tracked --strict
          python scripts/pre-commit/honesty_scan.py --strict
          python scripts/pre-commit/caliber_check.py --strict
          # structure_guard 的退出码 2 = git 不可用 / 不在仓库里（旧版打印警告后 return 0）
          python scripts/pre-commit/structure_guard.py --all --strict

      - name: Citation gate — synthetic references
        run: |
          python scripts/scan_citation_blacklist.py \
            --root "$PWD" \
            --report "$RUNNER_TEMP/scan_citation_report.json" \
            --overwrite

      - name: Registry mirror integrity
        run: python scripts/check_registry_mirror.py

      # 闭合门禁此前只由 doctor.py 手动调用，于是"读不懂 = 没有"的四处静默
      # 一直没人发现。自证 + 严格扫描一起进 CI：先证明门禁不空，再拿它判仓库。
      - name: Evidence-closure gate (fail-closed)
        run: |
          python -X utf8 scripts/check_evidence_closure.py --self-test
          python -X utf8 scripts/check_evidence_closure.py --strict

      # 数字复算器（verify_numbers.py）此前**完全不在 CI 里**：权威登记表在仓库
      # 外、results/ 不入库，全量复算在干净 checkout 上只会全是 DATA_MISSING。
      # 于是 --check-mirror 自加入起第一次对真实注册表运行就 KeyError（第一条
      # NR-1），而没有任何人会被告知。
      # 自证只吃临时目录里现造的注册表/数据/镜像，不依赖仓库数据，因此可以放心
      # 进 CI：它证明「一条坏数据只判该条 FAIL / 登记缺陷不伪装成缺数据 /
      # 双源校验三态（含未判定）」这三条契约真的成立；被回退时立刻变红。
      - name: Number-verification self-test (fail-closed)
        run: python -X utf8 scripts/verify_numbers.py --self-test

  # ---------------------------------------------------------------------------
  # 第三道：无 torch 回退档 —— 全量套件跑在 NumPy 实现上
  # ---------------------------------------------------------------------------
  # 为什么必须单独一遍：`marl/algorithms/qmix.py` 是**一个模块两套实现**，由
  # 模块级 `HAS_TORCH` 选择。全量 job 装了 torch ⇒ 那 2200+ 条用例全部落在
  # **torch 实现**上；回退实现只有第一道门里那 10 个文件覆盖。于是
  # 「第一道门绿」推不出「回退路径绿」，而回退路径**恰恰是 torch 装不上时
  # 真实会跑的那条**（本机实测：pip 装得上 torch，import 时 shm.dll 崩，
  # 代码就静默回退到 NumPy 版）。
  #
  # 本 job 只从 requirements.txt 里摘掉 torch 一行，其余依赖与全量 job 完全
  # 一致 —— 两个 job 的差异变量只有「torch 在不在」，不是「谁装得多」。
  test-fallback:
    name: pytest（无 torch · 回退档）
    needs: security-invariants
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies without torch
        run: |
          python -m pip install --upgrade pip
          grep -v -E '^[[:space:]]*torch' requirements.txt > /tmp/requirements-notorch.txt
          pip install -r /tmp/requirements-notorch.txt
          pip install pytest pytest-cov pytest-asyncio pytest-timeout

      - name: Confirm torch is really absent
        # 依赖解析若把 torch 作为传递依赖拖进来，本 job 就退化成全量 job 的
        # 复制品 —— 一条断言比注释更能挡住这种"假绿"。
        run: |
          python -c "import importlib.util as u; assert u.find_spec('torch') is None, 'torch 被意外安装，本 job 失去意义'; print('torch absent OK')"

      - name: Run full suite (NumPy fallback profile)
        # 唯一豁免：test_deps_importable 的契约就是「requirements.txt 里每个依赖
        # 都能 import」，本 job 刻意不装 torch，这条在此环境不适用。用 --deselect
        # 显式点名，而不是把断言改软（改软等于让它在全量 job 里也失去意义）。
        run: |
          python -m pytest tests/ -q --tb=short \
            --deselect tests/test_deps_scripts.py::TestRequirementsContent::test_deps_importable
