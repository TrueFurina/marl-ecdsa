name: build-binaries

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to upload binaries to (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            name: linux-amd64
            sep: ':'
            ext: ''
            icon: ''
          - os: macos-14
            name: macos-arm64
            sep: ':'
            ext: ''
            # macOS 的 PyInstaller --icon 需要 .icns；由 deliverables/_gen_icns.py 从
            # assets/icon.svg 渲染 16/32/64/128/256/512/1024 后打包（含 11 个 PNG 条目）
            icon: 'assets/icon.icns'
          - os: windows-2022
            name: windows-x64
            sep: ';'
            ext: '.exe'
            # 仅 Windows 生效：用官网同一套资产的 .ico（16/32/48/256）
            icon: 'assets/favicon.ico'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build deps
        # cryptography 是硬依赖：visualization/business_service.py 与
        # distributed_consensus.py 在导入期即 from cryptography.hazmat... 导入，
        # 缺失会让冒烟测试直接失败。psutil 为可选（业务面板的进程指标，try 内降级）。
        run: pip install flask pyinstaller cryptography psutil

      - name: Build single-file dashboard
        shell: bash
        env:
          SEP: ${{ matrix.sep }}
        run: |
          NAME="marlecdsa-dashboard-${{ matrix.name }}"
          SRC="marl-ecdsa-consensus-chain"
          # 程序图标：仅 Windows 走 --icon（PyInstaller 在 macOS 需 .icns、Linux 忽略该参数）
          ICON_ARG=""
          if [ -n "${{ matrix.icon }}" ]; then ICON_ARG="--icon=${{ matrix.icon }}"; fi
          echo "icon arg: [$ICON_ARG]"
          pyinstaller --onefile --noconfirm --clean $ICON_ARG \
            --name "$NAME" \
            --paths "$SRC" \
            --add-data "$SRC/templates${SEP}templates" \
            --add-data "$SRC/static${SEP}static" \
            --add-data "$SRC/number_registry.json${SEP}." \
            --add-data "$SRC/training_results_pure.json${SEP}." \
            --add-data "$SRC/training_results_bc.json${SEP}." \
            --add-data "$SRC/results/legacy_json/training_results_selfish.json${SEP}results/legacy_json" \
            "$SRC/scripts/exe/marlecdsa_launch.py"

      - name: Smoke test (start & probe)
        shell: bash
        run: |
          BIN="dist/marlecdsa-dashboard-${{ matrix.name }}${{ matrix.ext }}"
          chmod +x "$BIN" 2>/dev/null || true
          "$BIN" > smoke.log 2>&1 &
          PID=$!
          OK=0
          PORT=""
          for i in $(seq 1 20); do
            sleep 2
            # 启动器用 _free_port() 从 9090 起找空闲端口，实际端口打印在 banner 里
            if [ -z "$PORT" ]; then
              PORT=$(grep -oE 'http://127\.0\.0\.1:[0-9]+' smoke.log | head -1 | grep -oE '[0-9]+$')
            fi
            [ -z "$PORT" ] && PORT=9090
            # 注意：新版带登录鉴权，`/` 会 302 到 /login，且 /api/* 需登录（401）。
            # 因此用公开的 /healthz 判就绪、/login 判页面渲染，二者都通过才算成功。
            if curl -sf "http://127.0.0.1:${PORT}/healthz" >/dev/null 2>&1 \
               && curl -sf "http://127.0.0.1:${PORT}/login" | grep -q "MARL-ECDSA"; then
              OK=1; break
            fi
          done
          kill $PID 2>/dev/null || true
          if [ "$OK" != "1" ]; then
            echo "smoke test FAILED (port=${PORT:-unknown})"
            tail -30 smoke.log
            exit 1
          fi
          echo "smoke test OK (port=$PORT)"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/marlecdsa-dashboard-${{ matrix.name }}${{ matrix.ext }}

  upload:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist

      - name: Regenerate SHA256SUMS
        run: |
          ls -la dist
          cd dist
          sha256sum marlecdsa-dashboard-* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Attach binaries to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag }}
        run: |
          cd dist
          gh release upload "$TAG" marlecdsa-dashboard-* SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --clobber
          echo "attached to $TAG"
